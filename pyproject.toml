[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "ytmusic-cli"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["ytmusicapi>=1.12,<2", "textual>=8,<9"]
[project.scripts]
ytm = "ytmusic_cli.main:main"
[tool.setuptools.packages.find]
include = ["ytmusic_cli*"]
